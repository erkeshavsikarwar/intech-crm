<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intech Engineers CRM</title>
<style>
:root{--bg:#f4f5f7;--sf:#fff;--tx:#1a2230;--mu:#667085;--bd:#e1e4ea;--ac:#c2410c;--ac2:#fff;--ok:#15803d;--wa:#b45309;--bad:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--sf:#1b212b;--tx:#e8ebf0;--mu:#97a0af;--bd:#2c3441;--ac:#fb923c;--ac2:#1a1206;--ok:#4ade80;--wa:#fbbf24;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161d;--sf:#1b212b;--tx:#e8ebf0;--mu:#97a0af;--bd:#2c3441;--ac:#fb923c;--ac2:#1a1206;--ok:#4ade80;--wa:#fbbf24;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--ac);color:var(--ac2);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.s{padding:4px 9px;font-size:13px}.btn.r{color:var(--bad)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
#login{min-height:80vh;display:grid;place-items:center;padding:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px}
.lg{width:100%;max-width:380px}.lg h1{margin:0 0 2px;font-size:22px}.lg p{color:var(--mu);margin:0 0 8px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
#app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--sf);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
nav b{display:block;padding:4px 10px 12px;font-size:16px}nav b span{color:var(--ac)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--tx)}
nav button.on{background:var(--ac);color:var(--ac2);font-weight:600}
main{padding:18px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.top h2{margin:0;flex:1;font-size:20px}.top input{max-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat small{color:var(--mu);display:block}.stat b{font-size:22px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mu);text-transform:uppercase}
.one td,.one th{white-space:nowrap}.one .tn{display:inline-block;max-width:340px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}.one{min-width:1000px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);font-size:12px}
.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ac)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.al{border-left:4px solid var(--wa);padding:8px 12px;margin-bottom:8px;background:var(--sf);border-radius:8px;border:1px solid var(--bd);border-left-width:4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.al div{flex:1;min-width:180px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:min(480px,94vw);max-height:90vh;padding:16px}
dialog::backdrop{background:#0008}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{position:sticky;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px;z-index:5;border-right:0;border-bottom:1px solid var(--bd)}nav b{display:none}nav button{white-space:nowrap;width:auto}.row2{grid-template-columns:1fr}}
</style></head><body>

function cell(k,r,m){
 const v=r[k];
 if(k=='filled'){const o=[['Identified','❌ Not filled'],['Preparing','🛠 Preparing'],['Submitted','✅ Filled'],['Closed','🔒 Closed']];return `<select data-st="${r.id}" style="width:auto;min-width:130px;padding:4px 8px;font-weight:600;color:${r.status=='Submitted'?'var(--ok)':r.status=='Closed'?'var(--mu)':'var(--bad)'}">${o.map(([a,b])=>`<option value="${a}" ${(r.status||'Identified')==a?'selected':''}>${b}</option>`).join('')}</select>`}
 if(k=='name'&&m=='tenders')return `<span class="tn" title="${esc(v)}">${esc(v)}</span>`;
 if(k=='client')return esc(clientName(v));
 if(k=='date'||k=='due'||k=='deadline'){const d=dleft(v);const c=d!=null&&d<0&&!r.done?'bad':d!=null&&d<=2&&d>=0?'wa':'';return `<span class="${c}">${esc(fd(v))}${m=='tenders'&&r.time?' '+esc(r.time):''}${d!=null&&d>=0&&d<=2&&m!='tasks'?' ('+(d?d+'d':'today')+')':''}</span>`}

 const tabs=m=='tenders'?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px">${[['all','All',cnt.all],['f','✅ Filled',cnt.f],['n','❌ Not filled',cnt.n]].map(([k,l,n])=>`<button class="btn ${tf==k?'':'g'} s" data-tf="${k}">${l} (${n})</button>`).join('')}${[['Award status','af',['Pending','Won','Lost','Cancelled']],['Authority','auf',[...AUTH,'Other']]].map(([l,v,o])=>`<select data-sel="${v}" style="width:auto"><option value="">${l}: All</option>${o.map(x=>`<option ${(v=='af'?af:auf)==x?'selected':''}>${x}</option>`).join('')}</select>`).join('')}${af||auf||tf!='all'?'<button class="btn g s" data-clr>Clear filters</button>':''}</div>`:'';
 const more=m=='tenders'&&left>0?`<p style="text-align:center;margin:12px 0"><small style="color:var(--mu)">Showing ${shown.length} of ${total}</small><br><button class="btn g" data-more="10">Show 10 more</button> <button class="btn" data-more="all">Show all (${total})</button></p>`:(m=='tenders'&&total>10?`<p style="text-align:center;margin:12px 0"><small style="color:var(--mu)">Showing all ${total}</small> <button class="btn g s" data-more="less">Show less</button></p>`:'');
 return `<div class="top"><h2>${cfg.t}</h2><input id="sq" placeholder="Search…" value="${esc(q)}">${m=='tenders'?`<button class="btn g" data-sy>↻ Sync sheet</button><button class="btn g" data-ic>⬆ Import CSV</button><input type="file" id="icf" accept=".csv" hidden><small style="color:var(--mu);flex-basis:100%">${esc(syncMsg||('Last sync: '+(db.set.last||'never')))}</small>`:''}<button class="btn g" data-ex="${m}">Export CSV</button><button class="btn" data-add="${m}">+ Add</button></div>
 ${tabs}<div class="card tw"><table class="${m=='tenders'?'one':''}"><tr>${hd.map(h=>`<th>${esc(h)}</th>`).join('')}<th></th></tr>${shown.map(r=>`<tr>${cfg.c.map(k=>`<td>${cell(k,r,m)}</td>`).join('')}<td style="white-space:nowrap">${m=='tenders'?`<button class="btn g s" data-wa="${r.id}" title="WhatsApp reminder">💬</button> <button class="btn g s" data-fn="${r.id}" title="Copy folder name">📁</button> `:''}${m=='tenders'&&r.link?`<a class="btn g s" href="${esc(r.link)}" target="_blank" rel="noopener" style="text-decoration:none" title="Open Drive folder">📂</a> `:''}${m=='tasks'?`<button class="btn g s" data-tg="${r.id}">${r.done?'Undo':'Done'}</button> `:''}${m=='quotes'?`<button class="btn g s" data-pr="${r.id}">Print</button> `:''}<button class="btn g s" data-ed="${m}|${r.id}">Edit</button> ${me.role=='admin'?`<button class="btn g s r" data-dl="${m}|${r.id}">✕</button>`:''}</td></tr>`).join('')||`<tr><td colspan="9" style="color:var(--mu)">No records yet. Click “+ Add”.</td></tr>`}</table></div>${more}`;
}
function csv(m){
 const f=E[m].f.filter(x=>x[2]!='check'||1);const L=[f.map(x=>x[1]).join(',')];
 db[m].forEach(r=>L.push(f.map(([k])=>'"'+String(k=='client'?clientName(r[k]):r[k]??'').replace(/"/g,'""')+'"').join(',')));
 dl(L.join('\n'),m+'.csv','text/csv');
}
function dl(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function printQuote(id){
 const x=db.quotes.find(a=>a.id==id),w=window.open('','_blank');if(!w)return;
 w.document.write(`<title>Quotation ${esc(x.no)}</title><body style="font-family:sans-serif;max-width:700px;margin:30px auto">${logo()}<h2>INTECH ENGINEERS</h2><h3>Quotation ${esc(x.no)}</h3><p>Date: ${esc(fd(x.date))}<br>To: ${esc(clientName(x.client))}</p><table border="1" cellpadding="8" style="border-collapse:collapse;width:100%"><tr><th>Description</th><th>Amount</th></tr><tr><td>${esc(x.item)}</td><td>${inr(x.amount)}</td></tr><tr><td>GST @ ${esc(x.gst)}%</td><td>${inr(quoteTotal(x)-x.amount)}</td></tr><tr><th>Total</th><th>${inr(quoteTotal(x))}</th></tr></table><script>print()<\/script>`);w.document.close();
}
const NAV=[['dash','📊 Dashboard'],['clients','👥 Clients'],['tenders','📑 Tenders'],['ai','🤖 AI Assistant'],['projects','🏗 Projects'],['quotes','🧾 Quotations'],['tasks','✅ Tasks'],['team','⚙ Team']];
function draw(){
 if(!me)return loginView();if(!synced){synced=1;syncSheet();setTimeout(()=>{autoRemind();remindPopup()},4000)}
 R.innerHTML=`<div id="app"><nav><b>${logo()}INTECH <span>ENGINEERS</span></b>${NAV.map(([k,l])=>`<button data-v="${k}" class="${view==k?'on':''}">${l}</button>`).join('')}<button id="th">🌓 Theme</button><button id="lo">⏻ Logout (${esc(me.user)})</button></nav><main>${view=='dash'?dash():view=='team'?team():view=='ai'?ai():listView(view)}</main></div>`;
 bind();
}
function bind(){
 const on=(sel,fn)=>R.querySelectorAll(sel).forEach(e=>e.onclick=()=>fn(e));
 on('[data-v]',e=>{view=e.dataset.v;q='';draw()});
 on('[data-add]',e=>openForm(e.dataset.add));
 on('[data-ed]',e=>openForm(...e.dataset.ed.split('|')));
 on('[data-dl]',e=>{const[m,id]=e.dataset.dl.split('|');if(confirm('Delete this record?')){db[m]=db[m].filter(x=>x.id!=id);save();draw()}});
 on('[data-tg]',e=>{const t=db.tasks.find(x=>x.id==e.dataset.tg);t.done=!t.done;save();draw()});
 on('[data-wa]',e=>{if(!db.set.wa){alert('Set the reminder WhatsApp number under Team & Settings first.');return}wa(db.tenders.find(x=>x.id==e.dataset.wa))});
 on('[data-fn]',e=>{const t=db.tenders.find(x=>x.id==e.dataset.fn);navigator.clipboard&&navigator.clipboard.writeText(folder(t)).then(()=>alert('Copied: '+folder(t)),()=>prompt('Folder name',folder(t)))});
 on('[data-pr]',e=>printQuote(e.dataset.pr));
 on('[data-ex]',e=>csv(e.dataset.ex));
 on('#th',()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'});
 on('#lo',()=>{me=null;sessionStorage.removeItem('intech_me');draw()});
 const s=$('#sq');if(s)s.oninput=()=>{q=s.value;tshow=10;const p=s.selectionStart;draw();const n=$('#sq');n.focus();n.setSelectionRange(p,p)};
 const au=$('#au');if(au)au.onclick=async()=>{const n=$('#un').value.trim(),u=$('#uu').value.trim().toLowerCase(),p=$('#up').value;if(!n||!u||p.length<6){alert('Fill all fields; password min 6 characters.');return}if(db.users.some(x=>x.user==u)){alert('Username taken.');return}db.users.push({name:n,user:u,role:$('#ur').value,pw:await hash(p)});save();draw()};
 on('[data-du]',e=>{if(confirm('Remove user?')){db.users=db.users.filter(u=>u.user!=e.dataset.du);save();draw()}});
 const wp=$('#wp');if(wp){const up=()=>{const p=wp.value,T={cmb:['CallMeBot API key','','','Send “I allow callmebot to send me messages” to +34 644 51 95 23 on WhatsApp to get the key.'],green:['','Instance ID (idInstance)','API token (apiTokenInstance)','Sign up at green-api.com, create an instance, scan the QR with your WhatsApp, then copy the ID and token.'],ultra:['','Instance ID (e.g. instance12345)','Token','Sign up at ultramsg.com, connect your WhatsApp and copy the instance ID and token.'],hook:['','Webhook URL','','Make/Zapier/n8n webhook URL. It receives JSON: phone, message, tender, tender_id, date, time, link.']}[p];[['#wk','#l1',0],['#w1','#l2',1],['#w2','#l3',2]].forEach(([i,l,n])=>{$(i).style.display=$(l).style.display=T[n]?'':'none';if(T[n])$(l).textContent=T[n]});$('#wh').textContent=T[3]};wp.onchange=up;up()}
 const sw=$('#sw');if(sw)sw.onclick=()=>{db.set.wa=$('#wn').value.trim();db.set.cmb=$('#wk').value.trim();db.set.prov=$('#wp').value;db.set.p1=$('#w1').value.trim();db.set.p2=$('#w2').value.trim();save();alert('Saved.');autoRemind()};
 R.querySelectorAll('[data-st]').forEach(e=>e.onchange=()=>{const t=db.tenders.find(x=>x.id==e.dataset.st);t.status=e.value;t.lock=1;save();draw()});
 R.querySelectorAll('[data-aw]').forEach(e=>e.onchange=()=>{const t=db.tenders.find(x=>x.id==e.dataset.aw);t.award=e.value;t.lockA=1;save();draw()});
 on('[data-clr]',()=>{tf='all';af='';auf='';tshow=10;draw()});
 R.querySelectorAll('[data-sel]').forEach(e=>e.onchange=()=>{e.dataset.sel=='af'?af=e.value:auf=e.value;tshow=10;draw()});
 on('[data-tf]',e=>{tf=e.dataset.tf;tshow=10;draw()});on('[data-more]',e=>{const v=e.dataset.more;tshow=v=='all'?1e9:v=='less'?10:tshow+10;draw()});
 on('[data-sy]',()=>syncSheet(true));on('[data-ic]',()=>$('#icf').click());
 const icf=$('#icf');if(icf)icf.onchange=()=>{const f=icf.files[0];if(f)f.text().then(t=>syncSheet(true,csvParse(t)))};
 on('[data-rp]',async e=>{const p=prompt('New password for '+e.dataset.rp+' (6+ characters)');if(!p)return;if(p.length<6){alert('Too short.');return}db.users.find(u=>u.user==e.dataset.rp).pw=await hash(p);save();alert('Password updated.')});
 const ab=$('#ab'),aqi=$('#aq');if(ab){ab.onclick=()=>{aq=aqi.value;draw()};aqi.onkeydown=e=>{if(e.key=='Enter'){aq=aqi.value;draw()}}}
 on('[data-bw]',()=>{if(!db.set.wa){alert('Set the reminder WhatsApp number under Team & Settings first.');return}window.open('https://wa.me/'+db.set.wa.replace(/\D/g,'')+'?text='+encodeURIComponent(brief()),'_blank')});
 on('[data-bc]',()=>navigator.clipboard&&navigator.clipboard.writeText(brief()).then(()=>alert('Copied.')));
 const ss=$('#ss');if(ss)ss.onclick=()=>{db.set.sheet=$('#sid').value.trim().replace(/.*\/d\/([^\/?#]+).*/,'$1');db.set.gid=$('#sgid').value.trim()||'0';save();syncSheet(true)};
 const lf=$('#lf');if(lf)lf.onchange=()=>{const f=lf.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,320/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);db.set.logo=c.toDataURL('image/png');save();draw()};im.src=URL.createObjectURL(f)};
 const bk=$('#bk');if(bk)bk.onclick=()=>dl(JSON.stringify(db),'intech-crm-backup.json','application/json');
 const rs=$('#rs');if(rs)rs.onclick=()=>$('#rf').click();
 const rf=$('#rf');if(rf)rf.onchange=()=>{const f=rf.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.users)throw 0;db=o;save();draw()}catch(e){alert('Invalid backup file.')}})};
}
function loginView(){
 const first=!db.users.length;
 R.innerHTML=`<div id="login"><div class="card lg">${logo()}<h1>Intech Engineers</h1><p>${first?'Welcome! Create the admin account to begin.':'Sign in to your CRM'}</p>${first?'<label>Your name</label><input id="n">':''}<label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><div class="err" id="e"></div><button class="btn" id="go" style="width:100%">${first?'Create admin &amp; enter':'Sign in'}</button></div></div>`;
 const go=async()=>{
  const u=$('#u').value.trim().toLowerCase(),p=$('#p').value,e=$('#e');
  if(!u||!p){e.textContent='Enter username and password.';return}
  if(!crypto.subtle){e.textContent='Secure context required.';return}
  const h=await hash(p);
  if(first){if(p.length<6){e.textContent='Password must be 6+ characters.';return}db.users.push({name:$('#n').value||u,user:u,role:'admin',pw:h});save();me={user:u,role:'admin',name:u}}
  else{const f=db.users.find(x=>x.user==u&&x.pw==h);if(!f){e.textContent='Wrong username or password.';return}me={user:f.user,role:f.role,name:f.name}}
  sessionStorage.setItem('intech_me',JSON.stringify(me));draw();
 };
 $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key=='Enter')go()};
}
setInterval(()=>{if(me){syncSheet();autoRemind()}},120000);
draw();
</script></body></html>
